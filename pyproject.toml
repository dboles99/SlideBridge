[project]
name = "slidebridge"
version = "0.1.0"
description = "Convert PPTX decks into review-oriented DOCX packages with slide screenshots and editable tables"
authors = [
    { name = "Daniel Boles", email = "daniel.boles@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.0",
    "python-docx>=1.1.0",
    "pymupdf>=1.24.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "orjson>=3.10.0",
    "pillow>=10.3.0",
    "tenacity>=8.3.0",
    "pyyaml>=6.0.0",
    "rapidfuzz>=3.9.0",
]

[project.scripts]
slidebridge     = "slidebridge.cli:app"
slidebridge-gui = "slidebridge.gui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# python-docx, python-pptx, and Pillow ship incomplete or no type stubs;
# suppress attr-defined / valid-type errors in modules that use them heavily.
[[tool.mypy.overrides]]
module = [
    "slidebridge.build.docx_builder",
    "slidebridge.build.docx_images",
    "slidebridge.build.docx_styles",
    "slidebridge.build.docx_tables",
    "slidebridge.build.headings",
    "slidebridge.extract.table_extractor",
    "slidebridge.extract.text_extractor",
    "slidebridge.extract.title_detector",
    "slidebridge.render.image_optimizer",
    "slidebridge.config",
    "slidebridge.orchestration.jobs",
]
ignore_errors = true
